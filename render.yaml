services:
  - type: web
    name: needhi-ai
    env: docker
    plan: free
    envVars:
      - key: GEMINI_API_KEY
        sync: false # Primary Gemini API Key
      - key: GEMINI_API_KEY_2
        sync: false # Optional: Secondary Gemini API Key
      - key: GEMINI_API_KEY_3
        sync: false # Optional: Tertiary Gemini API Key
      - key: GEMINI_API_KEY_4
        sync: false # Optional: Quaternary Gemini API Key
      - key: GEMINI_API_KEY_5
        sync: false # Optional: Quinary Gemini API Key
      - key: GEMINI_API_KEY_6
        sync: false # Optional: Senary Gemini API Key
      - key: BREVO_API_KEY
        sync: false # Optional: Brevo API Key for email notifications
      - key: EMAIL_FROM
        sync: false # Optional: Sender email address
      - key: SMTP_HOST
        sync: false # Optional: Enter SMTP host for email notifications
      - key: SMTP_PORT
        sync: false # Optional: Enter SMTP port (e.g. 465)
      - key: SMTP_USER
        sync: false # Optional: Enter SMTP username/email
      - key: SMTP_PASSWORD
        sync: false # Optional: Enter SMTP app password
    disk:
      name: needhi-data
      mountPath: /opt/needhi-data
      sizeGB: 1

